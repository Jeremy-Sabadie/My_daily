<section class="news">
  <header class="news-header">
    <div>
      <small>MON JOURNAL</small>
      <h2>À la une</h2>
    </div>
    <small>Actualités Google News</small>
  </header>

  <div class="news-grid">
    @for (article of articles(); track article.category) {
      <a class="news-item"
         [href]="article.url"
         target="_blank"
         rel="noopener noreferrer">
        <div class="news-content">
          <small>{{ article.category }}</small>
          <h3>{{ article.title }}</h3>
          <p>{{ article.description }}</p>
          <small>{{ article.date }}</small>
        </div>
      </a>
    } @empty {
      <p>{{ error() ? 'Actualités indisponibles' : 'Chargement des actualités…' }}</p>
    }
  </div>
</section>
