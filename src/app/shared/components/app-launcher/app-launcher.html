<section class="apps">
  <h2>🚀 Mes applications</h2>

  <div class="app-grid">
    @for (app of apps; track app.name) {
      <a class="app"
         [href]="app.url"
         target="_blank"
         rel="noopener noreferrer"
         [attr.aria-label]="'Ouvrir ' + app.name">
        <span>{{ app.icon }}</span>
        <strong>{{ app.name }}</strong>
      </a>
    }
  </div>

  <small>Accès direct à mes applications</small>
</section>
